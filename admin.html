<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoStep — Терминал</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 2rem; }
        .preview-container { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 2.5rem; overflow: hidden; border: 2px solid #334155; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-[3rem] shadow-2xl mt-6">
        <div class="flex items-center justify-between mb-6">
            <span class="font-black text-emerald-400">ECOSTEP ADMIN</span>
            <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
        </div>
        
        <div class="preview-container mb-6">
            <video id="preview"></video>
            <div id="camera-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10">
                <button onclick="startCamera()" class="bg-emerald-500 px-6 py-3 rounded-2xl font-bold shadow-lg active:scale-95">
                    ВКЛЮЧИТЬ КАМЕРУ
                </button>
                <p class="text-[10px] mt-4 text-slate-500 uppercase tracking-widest">Нажмите для доступа</p>
            </div>
        </div>

        <div id="user-info" class="hidden space-y-6">
            <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-700 text-center">
                <p id="customer-name" class="text-xl font-black text-white">---</p>
                <p class="text-emerald-400 font-bold"><span id="customer-balance">0</span> 🌿</p>
            </div>
            
            <div class="relative">
                <input type="number" id="spend-amount" value="0" class="w-full bg-transparent border-b-2 border-slate-600 text-center text-6xl font-black py-4 outline-none focus:border-blue-500 transition-all">
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="setAmount(50)" class="bg-slate-700 py-3 rounded-xl font-bold">50</button>
                <button onclick="setAmount(100)" class="bg-slate-700 py-3 rounded-xl font-bold">100</button>
                <button onclick="document.getElementById('spend-amount').value='0'" class="bg-slate-700 py-3 rounded-xl font-bold">C</button>
            </div>
            
            <button id="confirm-btn" class="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl uppercase tracking-widest">
                Списать с баланса
            </button>
            <button onclick="resetScanner()" class="w-full text-slate-500 font-bold py-2 text-xs uppercase">Отмена</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ТВОЙ КОНФИГ (ЗАМЕНИ НА СВОЙ)
        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ecostep-dfc99.firebaseapp.com",
            projectId: "ecostep-dfc99",
            storageBucket: "ecostep-dfc99.appspot.com",
            messagingSenderId: "ID",
            appId: "ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let scanner = new Instascan.Scanner({ video: document.getElementById('preview'), mirror: false });
        let currentUserId = null;

        // Функция запуска камеры
        window.startCamera = function() {
            Instascan.Camera.getCameras().then(function (cameras) {
                if (cameras.length > 0) {
                    // Пробуем найти заднюю камеру (обычно последняя в списке)
                    let backCamera = cameras.find(c => c.name.toLowerCase().includes('back')) || cameras[cameras.length - 1];
                    scanner.start(backCamera);
                    document.getElementById('camera-overlay').style.display = 'none';
                    document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-emerald-500');
                } else {
                    alert('Камеры не найдены');
                }
            }).catch(function (e) {
                alert('Ошибка камеры: ' + e);
            });
        };

        scanner.addListener('scan', async function (content) {
            if (currentUserId) return;
            currentUserId = content;
            
            try {
                const userDoc = await getDoc(doc(db, "users", content));
                if (userDoc.exists()) {
                    const d = userDoc.data();
                    document.getElementById('customer-name').innerText = d.firstName;
                    document.getElementById('customer-balance').innerText = d.coins;
                    document.getElementById('user-info').classList.remove('hidden');
                    if (navigator.vibrate) navigator.vibrate(100);
                }
            } catch (e) { alert("Ошибка базы"); }
        });

        window.setAmount = (v) => document.getElementById('spend-amount').value = v;
        window.resetScanner = () => {
            currentUserId = null;
            document.getElementById('user-info').classList.add('hidden');
        };

        document.getElementById('confirm-btn').onclick = async () => {
            const amt = parseInt(document.getElementById('spend-amount').value);
            if (amt <= 0) return;
            try {
                await updateDoc(doc(db, "users", currentUserId), { coins: increment(-amt) });
                alert("Успешно списано!");
                resetScanner();
            } catch (e) { alert("Ошибка!"); }
        };
    </script>
</body>
</html>
