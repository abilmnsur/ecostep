<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoStep — Панель Продавца</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; }
        .scanner-box #reader { border: none !important; }
        .scanner-box video { border-radius: 1.5rem; object-fit: cover; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-[3rem] shadow-2xl border border-slate-700 mt-10">
        <div class="flex items-center justify-center gap-3 mb-8">
            <i class="fas fa-shield-check text-emerald-500 text-2xl"></i>
            <h1 class="text-xl font-black uppercase tracking-widest text-emerald-400">EcoStep Admin</h1>
        </div>
        
        <div class="scanner-box relative overflow-hidden rounded-[2rem] bg-black mb-6 border-2 border-slate-600 shadow-inner">
            <div id="reader" style="width: 100%;"></div>
        </div>

        <div id="user-info" class="hidden space-y-6 animate-pulse">
            <div class="bg-slate-700/50 p-6 rounded-3xl border border-emerald-500/30">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Покупатель</p>
                <p id="customer-name" class="text-2xl font-black text-white">---</p>
                <div class="flex justify-between items-end mt-4">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Текущий баланс</p>
                        <p class="text-3xl font-black text-emerald-400"><span id="customer-balance">0</span> 🌿</p>
                    </div>
                </div>
            </div>
            
            <div class="space-y-4">
                <input type="number" id="spend-amount" placeholder="Сумма списания" 
                    class="w-full p-5 rounded-2xl bg-slate-900 border border-slate-600 text-white text-xl font-bold outline-none focus:border-emerald-500 transition-all">
                
                <button id="confirm-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-5 rounded-2xl shadow-lg transition-all active:scale-95 uppercase tracking-widest">
                    Подтвердить списание
                </button>
                
                <button onclick="resetScanner()" class="w-full text-slate-400 font-bold py-2 text-sm uppercase">Отмена</button>
            </div>
        </div>

        <div id="status-msg" class="text-center text-slate-500 text-sm italic mt-4">
            <i class="fas fa-camera mr-2"></i> Ожидание QR-кода...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ВАЖНО: Вставь те же данные, что и в index.html
        const firebaseConfig = {
  apiKey: "AIzaSyBGBtCmbJ_c54hsomEEFT5UlIC-ax3K7mI",
  authDomain: "ecostep-dfc99.firebaseapp.com",
  databaseURL: "https://ecostep-dfc99-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ecostep-dfc99",
  storageBucket: "ecostep-dfc99.firebasestorage.app",
  messagingSenderId: "702037270996",
  appId: "1:702037270996:web:3fb011189b82f76f4fb641",
  measurementId: "G-6EBV1M5ECZ"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUserId = null;
        const html5QrCode = new Html5Qrcode("reader");

        // Запуск камеры
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

        async function onScanSuccess(decodedText) {
            if (currentUserId === decodedText) return;
            
            currentUserId = decodedText;
            document.getElementById('status-msg').innerText = "Поиск в базе...";

            try {
                const userRef = doc(db, "users", decodedText);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('customer-name').innerText = data.firstName;
                    document.getElementById('customer-balance').innerText = data.coins;
                    
                    document.getElementById('user-info').classList.remove('hidden');
                    document.getElementById('user-info').classList.remove('animate-pulse');
                    document.getElementById('status-msg').innerText = "Пользователь найден!";
                    
                    // Виброотклик (если поддерживается)
                    if (navigator.vibrate) navigator.vibrate(100);
                } else {
                    alert("Пользователь не найден!");
                    resetScanner();
                }
            } catch (e) {
                console.error(e);
                resetScanner();
            }
        }

        window.resetScanner = () => {
            currentUserId = null;
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('spend-amount').value = "";
            document.getElementById('status-msg').innerText = "Ожидание QR-кода...";
        };

        document.getElementById('confirm-btn').addEventListener('click', async () => {
            const amount = parseInt(document.getElementById('spend-amount').value);
            const balance = parseInt(document.getElementById('customer-balance').innerText);

            if (!amount || amount <= 0) return alert("Введите сумму");
            if (amount > balance) return alert("Недостаточно баллов!");

            try {
                const userRef = doc(db, "users", currentUserId);
                await updateDoc(userRef, {
                    coins: increment(-amount)
                });

                alert("Списано успешно!");
                resetScanner();
            } catch (e) {
                alert("Ошибка списания!");
            }
        });
    </script>
</body>
</html>
