<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoStep — Начни менять мир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .eco-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden w-full">

    <nav class="fixed top-0 w-full z-50 glass border-b border-emerald-100">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 shrink-0 cursor-pointer" onclick="window.scrollTo(0,0)">
                <i class="fas fa-leaf text-emerald-500 text-xl md:text-2xl"></i>
                <span class="text-xl md:text-2xl font-extrabold tracking-tight text-emerald-600 italic">EcoStep</span>
            </div>
            
            <div class="hidden md:flex gap-6 font-semibold text-slate-600 text-sm">
                <a href="#about" data-key="nav_about" class="hover:text-emerald-500 transition">О проекте</a>
                <a href="#steps" data-key="nav_steps" class="hover:text-emerald-500 transition">Как это работает</a>
                <a href="#events-section" class="hover:text-emerald-500 transition">Мероприятия</a>
            </div>

            <div class="flex items-center gap-2 md:gap-4">
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 w-[80px] justify-between">
                    <button onclick="setLanguage('ru')" id="btn-ru" class="w-[36px] h-[28px] rounded-lg text-[10px] font-bold transition-all bg-white shadow-sm">RU</button>
                    <button onclick="setLanguage('kz')" id="btn-kz" class="w-[36px] h-[28px] rounded-lg text-[10px] font-bold transition-all text-slate-400">KZ</button>
                </div>
                <button id="auth-btn" onclick="toggleModal(true)" class="eco-gradient text-white px-3 md:px-5 py-2 rounded-xl font-bold text-[11px] md:text-sm shadow-lg whitespace-nowrap min-w-[100px]">Присоединиться</button>
            </div>
        </div>
    </nav>
    
    <header class="pt-44 pb-20 px-6">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center">
            <div class="space-y-8 text-center lg:text-left">
                <div class="inline-block bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest" data-key="badge">EcoStep 2024</div>
                <h1 class="text-5xl md:text-7xl font-black leading-tight tracking-tighter" id="hero-title">Твои отходы — <br><span class="text-emerald-500 uppercase">инвестиция.</span></h1>
                <p class="text-xl text-slate-500 max-w-lg mx-auto lg:mx-0 font-medium">EcoStep — платформа, которая платит коинами за сдачу батареек и пластика в школе.</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                    <button onclick="toggleModal(true)" class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-emerald-600 transition shadow-2xl group">
                        <span>Личный кабинет</span>
                        <i class="fas fa-user group-hover:translate-x-2 transition"></i>
                    </button>
                </div>
            </div>

            <div class="relative hidden lg:block">
                <div class="absolute -inset-10 bg-emerald-400/20 blur-[100px] rounded-full animate-pulse"></div>
                <div class="relative glass border-2 border-white p-8 rounded-[3rem] shadow-2xl text-center">
                    <p id="user-welcome" class="text-emerald-600 font-bold mb-4 uppercase tracking-widest text-xs">Добро пожаловать</p>
                    <div id="qrcode" class="flex justify-center mb-6 p-4 bg-white rounded-2xl inline-block mx-auto"></div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">Твой баланс</p>
                        <div class="text-4xl font-black text-slate-800"><span id="user-balance">0</span> <span class="text-emerald-500 text-2xl">🌿</span></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section id="events-section" class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-4xl font-black mb-10 text-center">Активные сборы</h2>
            <div id="events-list" class="grid md:grid-cols-3 gap-6">
                <p class="text-center col-span-3 text-slate-400 italic">Загрузка мероприятий...</p>
            </div>
        </div>
    </section>

    <div id="regModal" class="modal px-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 md:p-10 relative shadow-2xl">
            <button onclick="toggleModal(false)" class="absolute top-6 right-6 text-slate-300"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-3xl font-black mb-6 text-slate-800">Регистрация / Вход</h3>
            <form id="auth-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="reg-name" placeholder="Имя" required class="bg-slate-50 border p-4 rounded-2xl w-full">
                    <input type="text" id="reg-surname" placeholder="Фамилия" required class="bg-slate-50 border p-4 rounded-2xl w-full">
                </div>
                <input type="email" id="reg-email" placeholder="E-mail" required class="bg-slate-50 border p-4 rounded-2xl w-full">
                <input type="password" id="reg-password" placeholder="Пароль" required class="bg-slate-50 border p-4 rounded-2xl w-full">
                <button type="submit" class="eco-gradient text-white w-full py-4 rounded-2xl font-black shadow-lg uppercase tracking-widest text-sm">Присоединиться</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "ТВОЙ_КЛЮЧ",
            authDomain: "ecostep-dfc99.firebaseapp.com",
            projectId: "ecostep-dfc99",
            storageBucket: "ecostep-dfc99.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentLang = 'ru';

        // 1. ПОЛУЧЕНИЕ МЕРОПРИЯТИЙ
        async function loadEvents() {
            const list = document.getElementById('events-list');
            const q = query(collection(db, "events"), where("status", "==", "active"));
            try {
                const snap = await getDocs(q);
                list.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    const title = currentLang === 'kz' ? data.title_kz : data.title_ru;
                    list.innerHTML += `
                        <div class="p-6 bg-slate-50 border rounded-[2rem] shadow-sm hover:shadow-md transition">
                            <p class="text-emerald-500 font-bold text-xs mb-2">${data.date}</p>
                            <h4 class="font-black text-xl mb-3">${title}</h4>
                            <p class="text-emerald-600 font-bold"><i class="fas fa-gift"></i> ${currentLang === 'kz' ? data.reward_info_kz : data.reward_info_ru}</p>
                        </div>
                    `;
                });
            } catch (e) { console.log(e); }
        }

        // 2. РЕГИСТРАЦИЯ И ВХОД
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const firstName = document.getElementById('reg-name').value;
            const lastName = document.getElementById('reg-surname').value;

            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", res.user.uid), {
                    firstName, lastName, coins: 50, role: "student"
                });
                toggleModal(false);
            } catch (err) { alert("Ошибка: " + err.message); }
        });

        // 3. ПРОВЕРКА СОСТОЯНИЯ (QR + Имя + Баланс)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    document.getElementById('user-balance').innerText = userData.coins;
                    document.getElementById('user-welcome').innerText = "Герой: " + userData.firstName;
                    document.getElementById('auth-btn').innerText = "Профиль";
                    
                    // Генерируем QR для списания (UID пользователя)
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), {
                        text: user.uid,
                        width: 128,
                        height: 128
                    });
                }
            }
        });

        window.toggleModal = (show) => {
            document.getElementById('regModal').classList.toggle('active', show);
        };

        loadEvents();
    </script>
</body>
</html>
